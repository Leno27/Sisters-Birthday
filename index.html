<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ef">
  <title>Alles Gute, Große Schwester!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <header class="hero">
    <h1>Alles Gute, <span>Große Schwester!</span></h1>
    <div class="progress">
      <p id="progressText">Tippe ein Feld an</p>
      <div class="bar"><div id="progressBar"></div></div>
    </div>
  </header>

  <main class="board" id="board"></main>

  <!-- Betrachter -->
  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Erinnerung">
    <div class="veil" id="veil"></div>
    <section class="sheet" id="sheet">
      <button class="close" id="close" aria-label="Schließen">&times;</button>
      <div class="show">
        <button class="nav prev" id="prev" aria-label="Zurück">&#8249;</button>
        <div class="media" id="media"></div>
        <button class="nav next" id="next" aria-label="Weiter">&#8250;</button>
      </div>
      <aside class="info">
        <div class="tag" id="tag"></div>
        <p class="cap" id="caption"></p>
        <div class="count" id="count"></div>
      </aside>
    </section>
  </div>

  <!-- Symbole für die Kategorien -->
  <div id="icons" hidden>
    <div data-icon="smarties"><svg viewBox="0 0 120 48" role="img" aria-label="Smarties">
          <rect x="6" y="8" width="108" height="32" rx="5" fill="#1e3a9e"/>
          <rect x="84" y="8" width="30" height="32" rx="5" fill="#d9b48a"/>
          <rect x="80" y="8" width="8" height="32" fill="#d9b48a"/>
          <text x="47" y="30" font-size="17" font-weight="800" text-anchor="middle" textLength="66" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#7b4a2d" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-family="Baloo 2, sans-serif">Smarties</text>
          <ellipse cx="14" cy="12" rx="4" ry="2.5" fill="#ff7bac"/><ellipse cx="46" cy="11" rx="4" ry="2.5" fill="#ffd23f"/><ellipse cx="72" cy="12" rx="4" ry="2.5" fill="#4fc3f7"/>
          <ellipse cx="24" cy="37" rx="4" ry="2.5" fill="#ef5350"/><ellipse cx="54" cy="37" rx="4" ry="2.5" fill="#66bb6a"/><ellipse cx="74" cy="37" rx="4" ry="2.5" fill="#ff9800"/>
        </svg></div>
    <div data-icon="gamecube"><svg viewBox="0 0 100 90" role="img" aria-label="GameCube">
          <!-- linke Seite mit Controller-Ports -->
          <path d="M8 30 L50 48 L50 84 L8 66 Z" fill="#4a46b4"/>
          <path d="M12 43.7 L46 58.3 L46 70.3 L12 55.7 Z" fill="#5d5d68"/>
          <g fill="#1b1b24">
            <ellipse cx="17" cy="51.5" rx="2.4" ry="3"/><ellipse cx="25" cy="55" rx="2.4" ry="3"/>
            <ellipse cx="33" cy="58.4" rx="2.4" ry="3"/><ellipse cx="41" cy="61.8" rx="2.4" ry="3"/>
          </g>
          <!-- rechte Seite mit Lüftungsgitter -->
          <path d="M50 48 L92 28 L92 64 L50 84 Z" fill="#35328f"/>
          <clipPath id="gcVent"><path d="M62 52.3 L86 40.9 L86 60.9 L62 72.3 Z"/></clipPath>
          <g clip-path="url(#gcVent)" stroke="#23206b" stroke-width="1.2">
            <path d="M64 40V80M68 40V80M72 40V80M76 40V80M80 40V80M84 40V80"/>
            <path d="M60 56L90 42M60 60L90 46M60 64L90 50M60 68L90 54M60 72L90 58"/>
          </g>
          <!-- Oberseite -->
          <path d="M8 30 L50 12 L92 28 L50 48 Z" fill="#6a66d6"/>
          <ellipse cx="52" cy="29" rx="16" ry="7.5" fill="#1b1b24"/>
          <ellipse cx="33" cy="20" rx="3.2" ry="1.7" fill="#fff"/>
        </svg></div>
    <div data-icon="reisen"><svg viewBox="0 0 150 50" role="img" aria-label="Reisen">
          <path d="M4 22 q0-5 8-5 h40 q8 0 8 5 q0 5 -8 5 H12 q-8 0 -8 -5Z" fill="#fff" stroke="#2f7fd0" stroke-width="2"/>
          <path d="M32 21 L22 4 h6 l18 17Z M32 24 L22 41 h6 l18 -17Z" fill="#4aa3f0"/>
          <path d="M6 20 L2 8 h7 l8 12Z" fill="#1fa7a0"/>
          <circle cx="50" cy="20" r="1.5" fill="#2f7fd0"/><circle cx="55" cy="21" r="1.5" fill="#2f7fd0"/>
          <line x1="74" y1="46" x2="84" y2="4" stroke="#3b2a5a" stroke-width="3" stroke-linecap="round"/>
          <path d="M94 36 v-9 q0-3 3-4 l8-2 q4-7 10-7 h12 q6 0 9 7 l6 2 q3 1 3 4 v9Z" fill="#f4f4f8" stroke="#8a8aa0" stroke-width="2" stroke-linejoin="round"/>
          <path d="M107 22 q3-6 7-6 h7 v7Z M125 16 h5 q3 0 5 7 h-10Z" fill="#4a5568"/>
          <circle cx="106" cy="37" r="6" fill="#3b3b4f"/><circle cx="106" cy="37" r="2.2" fill="#c8c8d8"/>
          <circle cx="134" cy="37" r="6" fill="#3b3b4f"/><circle cx="134" cy="37" r="2.2" fill="#c8c8d8"/>
        </svg></div>
    <div data-icon="familie"><svg viewBox="0 0 90 64" role="img" aria-label="Familie">
          <g stroke="none">
            <rect x="12" y="24" width="24" height="36" rx="10" fill="#f5b400"/>
            <rect x="44" y="26" width="26" height="34" rx="10" fill="#ff5a36"/>
            <rect x="22" y="40" width="20" height="22" rx="8" fill="#ff5a36"/>
            <rect x="52" y="44" width="20" height="18" rx="8" fill="#f5b400"/>
            <circle cx="24" cy="14" r="10" fill="#f2907a"/><path d="M13 12 q2-11 12-10 q10 0 11 10 q-6-5 -11-3 q-6 -1 -12 3Z" fill="#4a2a1e"/>
            <circle cx="57" cy="15" r="10" fill="#f2907a"/><path d="M46 14 q0-13 12-12 q11 1 10 14 q1 8 3 12 q-7-3-7-14 q-9 0 -18 0 q0 8 -3 14 q-1 -6 3 -14Z" fill="#4a2a1e"/>
            <circle cx="32" cy="38" r="7.5" fill="#f2907a"/><path d="M24 36 q1-8 9-8 q8 0 8 8 q-5-3 -8-2 q-5 -1 -9 2Z" fill="#4a2a1e"/>
            <circle cx="62" cy="42" r="7" fill="#f2907a"/><path d="M55 41 q0-8 8-8 q7 0 7 8 q-6-3 -8-2 q-4 0 -7 2Z" fill="#4a2a1e"/>
          </g>
        </svg></div>
  </div>

  <script src="script.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
